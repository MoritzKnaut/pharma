<!DOCTYPE html>
<html>
<head>
    <title>Zytostatika Debug</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Zytostatika Debug</h1>
    <div id="output"></div>
    <script src="src/data/shared.js"></script>
    <script src="src/data/categories/zytostatika/semanticTags.js"></script>
    <script src="src/data/categories/zytostatika/learning.js"></script>
    <script src="src/data/categories/zytostatika/groups/dna-cross-linking/entries/alkylanzien.js"></script>
    <script src="src/data/categories/zytostatika/groups/dna-cross-linking/entries/platin-derivate.js"></script>
    <script src="src/data/categories/zytostatika/groups/dna-cross-linking/_main.js"></script>
    <script src="src/data/categories/zytostatika/index.js"></script>
    <script src="src/data/atlasCollection.js"></script>
    <script>
        var output = document.getElementById('output');
        output.innerHTML += '<h2>Window Objects:</h2>';
        output.innerHTML += '<p>pharmaAtlasShared: ' + (window.pharmaAtlasShared ? 'YES' : 'NO') + '</p>';
        output.innerHTML += '<p>pharmaAtlasCategoryParts: ' + (window.pharmaAtlasCategoryParts ? 'YES' : 'NO') + '</p>';
        output.innerHTML += '<p>pharmaAtlasCategories: ' + (window.pharmaAtlasCategories ? 'YES' : 'NO') + '</p>';
        output.innerHTML += '<p>pharmaAtlasCollection: ' + (window.pharmaAtlasCollection ? 'YES' : 'NO') + '</p>';
        
        if (window.pharmaAtlasCategories && window.pharmaAtlasCategories.zytostatika) {
            var cat = window.pharmaAtlasCategories.zytostatika;
            output.innerHTML += '<h2>Zytostatika Category:</h2>';
            output.innerHTML += '<p>ID: ' + cat.id + '</p>';
            output.innerHTML += '<p>Label: ' + cat.label + '</p>';
            output.innerHTML += '<p>Overgroups count: ' + (cat.overgroups ? cat.overgroups.length : 0) + '</p>';
            
            if (cat.overgroups) {
                cat.overgroups.forEach(function(og, i) {
                    output.innerHTML += '<h3>Overgroup ' + i + ': ' + og.id + '</h3>';
                    output.innerHTML += '<p>Kind: ' + (og.kind || 'none') + '</p>';
                    output.innerHTML += '<p>Title: ' + (og.title || 'none') + '</p>';
                    output.innerHTML += '<p>Sections count: ' + (og.sections ? og.sections.length : 0) + '</p>';
                    
                    if (og.sections) {
                        og.sections.forEach(function(sec, j) {
                            output.innerHTML += '<p>Section ' + j + ': ' + sec.id + ' (type: ' + sec.type + ')</p>';
                            if (sec.entries) {
                                output.innerHTML += '<p>Entries count: ' + sec.entries.length + '</p>';
                                sec.entries.forEach(function(entry, k) {
                                    output.innerHTML += '<p>Entry ' + k + ': ' + (entry ? entry.name : 'NULL') + '</p>';
                                });
                            }
                        });
                    }
                });
            }
        }
        
        if (window.pharmaAtlasCollection) {
            output.innerHTML += '<h2>Collection Categories:</h2>';
            window.pharmaAtlasCollection.categories.forEach(function(cat) {
                output.innerHTML += '<p>- ' + cat.id + '</p>';
            });
        }
    </script>
</body>
</html>
